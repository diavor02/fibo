<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Grinder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Hash Grinder</h1>
      <p class="subtitle">Hash any string <strong>n</strong> times with SHA-256.</p>

      <form id="hash-form" class="card">
        <label for="text">Text</label>
        <input id="text" name="text" type="text" placeholder="Enter text..." required />

        <label for="n">Iterations (n)</label>
        <input id="n" name="n" type="number" min="0" step="1" value="1" required />

        <button type="submit">Grind Hash</button>
      </form>

      <section class="card result" id="result-card" hidden>
        <h2>Result</h2>
        <p><strong>Input:</strong> <span id="result-input"></span></p>
        <p><strong>n:</strong> <span id="result-n"></span></p>
        <p><strong>Hash:</strong></p>
        <code id="result-hash"></code>
      </section>

      <p id="message" class="message"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
